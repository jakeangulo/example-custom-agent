#cloud-config
# Example user_data that installs OpenClaw + Kali on first boot, for running the
# installer without the provisioner (for example from the Hetzner console or
# `hcloud server create --user-data-from-file`). The provisioner renders its own
# equivalent and injects CALLBACK_URL, CALLBACK_TOKEN and JOB_ID itself.
#
# user_data is readable through the Hetzner API and the metadata service for the
# server's whole life. The installer blocks the metadata service for containers
# and non-root users, and this script deletes its env file and cloud-init's
# cached copies of user_data when the install ends. Values are single-quoted
# because the env file is sourced by bash.

write_files:
  - path: /root/openclaw-install.env
    permissions: "0600"
    owner: root:root
    content: |
      INSTALL_REPO_URL='https://gitlab.com/appyfic/example-custom-agent.git'
      INSTALL_REPO_REF='0000000000000000000000000000000000000000'
      INSTALL_SCRIPT='install.sh'
      OPENCLAW_VERSION='2026.10.2'
      KALI_IMAGE='kalilinux/kali-rolling@sha256:1ff4a2be3849333687b3ed2b31bb5af0cd1b7c0a11ec7713feb5abe5a6b2795c'
      KALI_PACKAGES='kali-linux-headless'
      CALLBACK_URL='https://receiver.example.com/deployments/demo-1/events'
      CALLBACK_TOKEN='replace-with-a-long-random-token'
      JOB_ID='demo-1'
      LLM_AUTH_CHOICE='apiKey'
      LLM_API_KEY='replace-with-the-provider-key'

runcmd:
  - - bash
    - -c
    - |
      set -euo pipefail
      set -a; . /root/openclaw-install.env; set +a
      if ! command -v git >/dev/null; then
        if command -v apt-get >/dev/null; then
          apt-get -o DPkg::Lock::Timeout=600 update -q && apt-get -o DPkg::Lock::Timeout=600 install -y -q git
        else
          dnf -y install git
        fi
      fi
      rm -rf /opt/openclaw-installer
      git clone -q "$INSTALL_REPO_URL" /opt/openclaw-installer
      git -C /opt/openclaw-installer checkout -q "$INSTALL_REPO_REF"
      rc=0
      bash "/opt/openclaw-installer/$INSTALL_SCRIPT" || rc=$?
      shred -u /root/openclaw-install.env
      # cloud-init keeps user_data (with the secrets) in several files; none is
      # needed after first boot, and obj.pkl is rebuilt on the next boot.
      rm -f /var/lib/cloud/instances/*/user-data.txt /var/lib/cloud/instances/*/user-data.txt.i \
        /var/lib/cloud/instances/*/cloud-config.txt /var/lib/cloud/instances/*/obj.pkl
      exit "$rc"
