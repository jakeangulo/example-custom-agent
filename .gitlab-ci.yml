stages: [test]

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck -x install.sh files/openclaw-metadata-block files/openclaw-cli tests/hetzner/run-matrix.sh

unit-tests:
  stage: test
  image:
    name: bats/bats:latest
    entrypoint: [""]
  before_script:
    - apk add --no-cache jq coreutils git ruby
  script:
    - bats tests/unit
